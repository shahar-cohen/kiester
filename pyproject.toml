[project]
name = "kiester"
version = "2.1.0"
description = "Kiester — an unofficial desktop interface for the kie.ai API (video + image generation)"
requires-python = ">=3.9"
# Normal installs use install.bat / install.command / install.sh, which put these in .venv. No npm, no JS build step.
dependencies = ["flask>=2.3", "pillow>=9", "imageio-ffmpeg>=0.4.9"]

[project.optional-dependencies]
# only needed for the browser smoke test in tests/
dev = ["websockets>=12"]

[project.scripts]
kiester = "kiester.__main__:main"

[tool.setuptools]
packages = ["kiester"]

[tool.setuptools.package-data]
kiester = ["models.json", "static/*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
